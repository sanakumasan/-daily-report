<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETC高速記録アプリ</title>
</head>
<body style="font-family:sans-serif; padding:15px; max-width:500px; margin:0 auto;">

    <h2>🚗 ETC高速利用記録</h2>

    <div style="background:#e0f2fe; padding:10px; border-radius:5px; margin-bottom:15px; text-align:center;">
        <span id="current-month-label" style="font-weight:bold;">今月</span>の合計ETC代:
        <span id="month-total-etc" style="font-size:1.4rem; font-weight:bold; color:#0284c7;">0</span> 円
    </div>

    <div style="margin-bottom:10px; text-align:right;">
        <a href="https://driveplaza.com" target="_blank" rel="noopener noreferrer" style="color:#0284c7; text-decoration:none; font-weight:bold; font-size:0.95rem;">🌐 公式料金検索を開く (ドラぷら)</a>
    </div>

    <form onsubmit="saveData(event)" style="background:#f8fafc; padding:15px; border:1px solid #cbd5e1; border-radius:5px;">
        <p style="margin-top:0;">利用日時:<br><input type="datetime-local" id="etc-date" required style="width:100%; padding:8px; box-sizing:border-box;"></p>

        <p>入口IC:<br>
            <input type="text" id="entry-ic" placeholder="例：東京" required style="width:100%; padding:8px; box-sizing:border-box;">
            <button type="button" onclick="getLocation('entry')" style="margin-top:6px; padding:8px; width:100%;">📍 現在地から入口IC候補を取得</button>
            <small id="entry-location-status" style="display:block; margin-top:4px; color:#475569;"></small>
        </p>

        <p>出口IC:<br>
            <input type="text" id="exit-ic" placeholder="例：横浜" required style="width:100%; padding:8px; box-sizing:border-box;">
            <button type="button" onclick="getLocation('exit')" style="margin-top:6px; padding:8px; width:100%;">📍 現在地から出口IC候補を取得</button>
            <small id="exit-location-status" style="display:block; margin-top:4px; color:#475569;"></small>
        </p>

        <p>ETC料金（円）:<br><input type="number" id="etc-price" placeholder="例：1200" min="0" required style="width:100%; padding:8px; box-sizing:border-box;"></p>
        <p>メモ（任意）:<br><input type="text" id="etc-memo" placeholder="仕事、旅行など" style="width:100%; padding:8px; box-sizing:border-box;"></p>

        <button type="submit" style="width:100%; padding:12px; background:#0284c7; color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">記録を保存する</button>
    </form>

    <h3>📊 利用履歴</h3>
    <p>表示月: <input type="month" id="filter-month" onchange="showHistory()"></p>
    <div id="history-list"></div>

<script>
    let etcRecords = [];
    // 位置情報はIC名を確定するものではなく、周辺住所を候補として入力欄に入れます。
    // 正確なIC名かどうかを確認し、必要に応じて手動で修正してください。

    window.onload = function() {
        const now = new Date();
        document.getElementById('etc-date').value = toLocalDateTimeValue(now);
        document.getElementById('filter-month').value =
            now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        loadData();
    };

    function toLocalDateTimeValue(date) {
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 16);
    }

    function loadData() {
        const stored = localStorage.getItem('etc_highway_records');
        if (stored) {
            try { etcRecords = JSON.parse(stored); }
            catch (e) { console.error('保存データを読み込めませんでした', e); }
        }
        showHistory();
    }

    function getLocation(type) {
        const status = document.getElementById(type + '-location-status');
        const input = document.getElementById(type + '-ic');

        if (!navigator.geolocation) {
            status.textContent = 'このブラウザでは位置情報を利用できません。IC名を手入力してください。';
            return;
        }

        status.textContent = '位置情報を取得しています…';

        navigator.geolocation.getCurrentPosition(async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            status.textContent = `位置情報取得済み（精度 約${Math.round(position.coords.accuracy)}m）。周辺住所を検索中…`;

            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=18&addressdetails=1`;
                const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!response.ok) throw new Error('住所検索に失敗しました');
                const result = await response.json();

                const address = result.address || {};
                const parts = [
                    address.road,
                    address.neighbourhood || address.suburb,
                    address.city || address.town || address.village || address.city_district,
                    address.state
                ].filter(Boolean);
                const candidate = parts.length ? parts.join('、') : (result.display_name || '');

                if (candidate) {
                    input.value = candidate;
                    status.textContent = `周辺住所の候補を入力しました（精度 約${Math.round(position.coords.accuracy)}m）。実際のIC名と違う場合は修正してください。`;
                } else {
                    input.value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                    status.textContent = '住所候補を取得できませんでした。座標を入力しました。IC名は手入力で修正してください。';
                }
            } catch (error) {
                input.value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
                status.textContent = '住所候補の取得に失敗しました。座標を入力しました。IC名は手入力で修正してください。';
            }
        }, function(error) {
            let message = '位置情報を取得できませんでした。';
            if (error.code === 1) message = '位置情報が許可されていません。ブラウザの設定で位置情報を許可してください。';
            if (error.code === 2) message = '現在地を特定できませんでした。電波状況を確認してください。';
            if (error.code === 3) message = '位置情報の取得がタイムアウトしました。もう一度お試しください。';
            status.textContent = message;
        }, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        });
    }

    function saveData(e) {
        e.preventDefault();

        const entryStatus = document.getElementById('entry-location-status').textContent;
        const exitStatus = document.getElementById('exit-location-status').textContent;

        etcRecords.push({
            id: Date.now(),
            date: document.getElementById('etc-date').value,
            entry: document.getElementById('entry-ic').value.trim(),
            exit: document.getElementById('exit-ic').value.trim(),
            price: parseInt(document.getElementById('etc-price').value, 10) || 0,
            memo: document.getElementById('etc-memo').value.trim(),
            entryLocationStatus: entryStatus,
            exitLocationStatus: exitStatus
        });

        localStorage.setItem('etc_highway_records', JSON.stringify(etcRecords));

        document.getElementById('entry-ic').value = '';
        document.getElementById('exit-ic').value = '';
        document.getElementById('etc-price').value = '';
        document.getElementById('etc-memo').value = '';
        document.getElementById('entry-location-status').textContent = '';
        document.getElementById('exit-location-status').textContent = '';

        showHistory();
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, function(char) {
            return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char];
        });
    }

    function showHistory() {
        const filterMonth = document.getElementById('filter-month').value;
        document.getElementById('current-month-label').innerText =
            filterMonth ? filterMonth.replace('-', '年') + '月' : '選択月';

        const container = document.getElementById('history-list');
        container.innerHTML = '';
        let monthTotal = 0;

        [...etcRecords].sort((a, b) => b.date.localeCompare(a.date)).forEach(function(r) {
            if (r.date.slice(0, 7) !== filterMonth) return;

            monthTotal += Number(r.price) || 0;

            const div = document.createElement('div');
            div.style.borderBottom = '1px solid #e2e8f0';
            div.style.padding = '10px 0';
            div.innerHTML = `
                <div style="font-size:0.8rem; color:#64748b;">📅 ${escapeHtml(r.date.replace('T', ' '))}</div>
                <div style="font-weight:bold; margin:3px 0;">📍 ${escapeHtml(r.entry)} ➡️ 🏁 ${escapeHtml(r.exit)}</div>
                <div style="display:flex; justify-content:space-between; gap:10px;">
                    <span>💰 <strong style="color:#0284c7;">${(Number(r.price) || 0).toLocaleString()}</strong> 円 ${r.memo ? `(${escapeHtml(r.memo)})` : ''}</span>
                    <span style="color:#ef4444; font-size:0.85rem; cursor:pointer;" onclick="deleteData(${Number(r.id)})">削除</span>
                </div>
            `;
            container.appendChild(div);
        });

        document.getElementById('month-total-etc').innerText = monthTotal.toLocaleString();
    }

    function deleteData(id) {
        if (confirm('この記録を削除しますか？')) {
            etcRecords = etcRecords.filter(r => r.id !== id);
            localStorage.setItem('etc_highway_records', JSON.stringify(etcRecords));
            showHistory();
        }
    }
</script>
</body>
</html>
